server:
  port: 8080
spring:
  application:
    name: balloon-backend
  datasource:
    url: jdbc:h2:file:./data/balloon;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: false
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
daily-bonus:
  # День определяется сервером, а не часовым поясом браузера.
  zone-id: Europe/Moscow
auth:
  # Сессия входа действует столько с последнего обращения (ISO-8601); в базе хранится только SHA-256 токена.
  session-ttl: P30D
  # Как часто удалять истёкшие сессии, мс.
  session-cleanup-ms: 3600000
