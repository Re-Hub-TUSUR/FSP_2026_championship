# Справочный снимок значений из Config.defaults (domain/Models.java).
# Источник правды для работающего сервера — сам класс и PUT /api/v1/admin/config.
gameId: balloon
themes:
  RED:
    levels: 12
    baseHazard: 0.15      # шанс на уровне L ≥ 2 = baseHazard × hazardGrowth^(L-1); первый подъём без риска
    hazardGrowth: 1.14    # во столько раз растёт шанс взрыва с каждым уровнем; ×2 на 5-м уровне, вершина ×159.75
    maxHazard: 0.60       # потолок шанса взрыва
  GREEN:
    levels: 9
    baseHazard: 0.10
    hazardGrowth: 1.25    # ×2 на 5-м уровне, вершина ×23.54
    maxHazard: 0.60
# Первый подъём без риска, забрать выигрыш можно со второго уровня, бустер выпадает равновероятно начиная с третьего.
# Один уровень длится 1,5 секунды (GameService.TICK_MS).
rtp: 0.96                 # возврат игроку; коэффициент уровня = rtp / шанс долететь до уровня
pointsPerLevel: 10
pointsCashoutBonus: 20
pointsBoosterBonus: 15    # умножается на бустер ставки
minWinAmount: 10          # порог выигрыша для «Закрепи успех»; само предложение приходит раз в 3 выигрыша
popupTimeout: 10          # окно предложения закрывается само через столько секунд после показа
